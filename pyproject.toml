[build-system]
requires = ["hatchling==1.27.0"]
build-backend = "hatchling.build"

[project]
name = "clippy-clipboard-manager"
version = "0.1.0"
description = "A local-first Windows clipboard manager with offline classification, semantic search, risk warnings, and an encrypted vault."
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.11,<3.13"
authors = [{ name = "Clippy contributors" }]
keywords = [
  "clipboard-manager",
  "clipboard-history",
  "windows-11",
  "pyside6",
  "sqlite",
  "onnx-runtime",
  "semantic-search",
  "local-first",
  "privacy",
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "License :: OSI Approved :: MIT License",
  "Operating System :: Microsoft :: Windows :: Windows 11",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
]
dependencies = [
  "cryptography==50.0.0",
  "numpy==1.26.4",
  "onnxruntime==1.20.1",
  "pynput==1.7.7",
  "pyperclip==1.9.0",
  "PySide6==6.8.3",
  "tokenizers==0.19.1",
]

[project.urls]
Homepage = "https://github.com/MohammedYessineKraiem/Clippy"
Repository = "https://github.com/MohammedYessineKraiem/Clippy.git"
Issues = "https://github.com/MohammedYessineKraiem/Clippy/issues"

[project.optional-dependencies]
dev = [
  "hatchling==1.27.0",
  "onnx==1.17.0",
  "pyinstaller==6.12.0",
  "pytest==8.3.5",
  "ruff==0.9.10",
  "torch==2.1.0",
  "transformers==4.44.2",
]

[project.scripts]
clippy = "clippy.app:main"

[tool.hatch.build.targets.wheel]
packages = ["src/clippy"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
