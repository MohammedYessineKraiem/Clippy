[build-system]
requires = ["hatchling==1.27.0"]
build-backend = "hatchling.build"

[project]
name = "clippy-clipboard-manager"
version = "0.1.0"
description = "A private, local-first clipboard manager for Windows 11."
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.11,<3.13"
authors = [{ name = "Clippy contributors" }]
keywords = ["clipboard", "windows", "pyside6", "local-first"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "License :: OSI Approved :: MIT License",
  "Operating System :: Microsoft :: Windows :: Windows 11",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
]
dependencies = [
  "cryptography==44.0.2",
  "numpy==1.26.4",
  "onnxruntime==1.20.1",
  "pynput==1.7.7",
  "pyperclip==1.9.0",
  "PySide6==6.8.3",
  "tokenizers==0.19.1",
]

[project.optional-dependencies]
dev = [
  "hatchling==1.27.0",
  "onnx==1.17.0",
  "pyinstaller==6.12.0",
  "pytest==8.3.5",
  "ruff==0.9.10",
  "torch==2.1.0",
  "transformers==4.44.2",
]

[project.scripts]
clippy = "clippy.app:main"

[tool.hatch.build.targets.wheel]
packages = ["src/clippy"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
